app:
  log_level: INFO
paths:
  raw_output_root: data/raw
  reference_output_root: data/references
  processed_output_root: data/processed
  labels_output_root: data/labels
  reports_output_root: data/reports
  models_output_root: data/models
dataset_qc:
  min_samples_per_class: 20
  min_batches_per_class: 2
  min_capture_dates_per_class: 2
  min_classes: 2
runtime_dashboard:
  default_alarm_profile: line_standard
  line_profile_map:
    default: line_relaxed
    line-a: line_relaxed
    line-b: line_relaxed
  alarm_profiles:
    line_standard:
      max_unknown_ratio: 0.15
      max_dropped_small_components: 64
      min_objects_per_window: 1
    line_sensitive:
      max_unknown_ratio: 0.1
      max_dropped_small_components: 40
      min_objects_per_window: 1
    line_relaxed:
      max_unknown_ratio: 0.25
      max_dropped_small_components: 120
      min_objects_per_window: 0
  operational_targets:
    max_alarm_window_ratio: 0.095
    max_critical_window_ratio: 0.01
    max_mean_unknown_ratio: 0.2
  operational_targets_by_line:
    line-a:
      max_alarm_window_ratio: 0.05
      max_critical_window_ratio: 0.01
      max_mean_unknown_ratio: 0.2
    line-b:
      max_alarm_window_ratio: 0.1
      max_critical_window_ratio: 0.01
      max_mean_unknown_ratio: 0.2
ui_theme:
  active_preset: steel_light
  presets:
    steel_light:
      extends: steel_light
      bg: "#F3F5F7"
      surface: "#FFFFFF"
      text: "#111827"
      muted: "#64748B"
      accent: "#0F766E"
      success: "#15803D"
      warn: "#B45309"
      error: "#B91C1C"
      radius: 10
      shadow: "#D5DBE3"
      font_family: "\"Bahnschrift\", \"Segoe UI Variable\", \"Segoe UI\", sans-serif"
