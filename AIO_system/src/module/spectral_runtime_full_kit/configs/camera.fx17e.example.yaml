  exposure_time_us: 4000
  line_rate_hz: 100.0
  wavelength_range_nm: [950.0, 1700.0]
  rgb_bands: [32, 96, 160]

frame_filter:
  dark_mean_threshold: 1.0

simulate:
  seed: 7

lumo:
  auto_from_local_network: true
  serial_number:
  interface_name: "이더넷 3"
  mac_address: "70-F8-E7-B0-11-1B"
